<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AIBaG - AI Infra 与经典算法面试训练场" />
    <title>AIBaG · Algorithm Interview Lab</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="AIBaG 首页">
        <span class="wordmark-main">AIBaG</span>
        <span class="wordmark-sub">ALGORITHM INTERVIEW LAB</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a class="active" href="/">题库</a>
        <a href="/completed.html">做过的题</a>
      </nav>
      <div class="api-badge">
        <span id="api-dot" class="status-dot"></span>
        <span id="api-status">连接本地后端…</span>
      </div>
    </header>

    <main class="catalog-view catalog-simple">
      <section class="catalog-intro">
        <div>
          <span class="eyebrow">INTERVIEW PRACTICE</span>
          <h1>题库</h1>
        </div>
        <p><strong id="problem-count">200</strong> 道题 · AI Review · 多轮追问</p>
      </section>

      <nav class="track-tabs" aria-label="题目方向">
        <button class="active" data-kind="">全部</button>
        <button data-kind="coding">AI Infra 类</button>
        <button data-kind="knowledge">简答八股</button>
        <button data-kind="algorithm">力扣手撕</button>
      </nav>

      <section class="problem-library">
        <div class="section-heading">
          <div>
            <span class="eyebrow">PROBLEM SET</span>
            <h2 id="track-title">全部题目</h2>
          </div>
          <div class="filters">
            <label class="search-field">
              <span>搜索</span>
              <input id="problem-search" type="search" placeholder="题目 / 标签" />
            </label>
          </div>
        </div>

        <div class="problem-table-wrap">
          <table class="problem-table">
            <thead>
              <tr>
                <th class="status-col">状态</th>
                <th>题目</th>
                <th>方向</th>
                <th>难度</th>
                <th class="action-col"></th>
              </tr>
            </thead>
            <tbody id="problem-list">
              <tr class="loading-row"><td colspan="5">正在读取 JSON 题库…</td></tr>
            </tbody>
          </table>
        </div>
        <button id="load-more" class="load-more" type="button" hidden>加载更多</button>
      </section>
    </main>

    <footer class="site-footer">
      <span>AIBaG · Local-first interview practice</span>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
